<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121612" />
    <meta name="description" content="Universe Voicee — общий плейлист ваших людей. Предлагайте музыку, голосуйте и открывайте любимое вместе." />
    <title>Universe Voicee — музыка, которой делятся</title>
